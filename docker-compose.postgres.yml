services:
  postgres:
    image: postgres:16-alpine
    container_name: 0xcafe-market-postgres
    environment:
      # Quote the name so YAML does not parse 0xcafe as a hexadecimal integer.
      POSTGRES_DB: "0xcafe"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - market-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 0xcafe"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  market-postgres-data:

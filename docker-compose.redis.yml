services:
  redis:
    image: redis:7-alpine
    container_name: 0xcafe-market-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - market-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  market-redis-data:
